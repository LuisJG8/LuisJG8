name: Update Codex Model Usage

on:
  schedule:
    - cron: "15 16 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codex-model-usage
  cancel-in-progress: false

jobs:
  update-usage:
    runs-on: [self-hosted, codex-usage]
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Check local time window
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_HOUR=$(TZ=America/Los_Angeles date +%H)
          if [ "$LOCAL_HOUR" = "09" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate usage files
        if: steps.guard.outputs.proceed == 'true'
        run: python3 scripts/update_model_usage.py

      - name: Commit and push usage update
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        run: |
          if git diff --quiet -- README.md data/model-usage.json; then
            echo "No usage changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/model-usage.json
          git commit -m "Update Codex model usage"
          git push
